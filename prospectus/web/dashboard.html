<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>__TITLE__ · S-1 Prospectus Terminal</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg%20xmlns%3D%22http%3A//www.w3.org/2000/svg%22%20viewBox%3D%220%200%20120%20120%22%20width%3D%22120%22%20height%3D%22120%22%3E%3Crect%20width%3D%22120%22%20height%3D%22120%22%20rx%3D%2226%22%20fill%3D%22%23ED5A24%22/%3E%3Cpath%20d%3D%22M16%2042l14%2018-14%2018%22%20stroke%3D%22%23FFFFFF%22%20stroke-width%3D%2210%22%20stroke-linecap%3D%22square%22%20stroke-linejoin%3D%22miter%22%20fill%3D%22none%22/%3E%3Cg%20fill%3D%22%230B1424%22%3E%3Crect%20x%3D%2242%22%20y%3D%2242%22%20width%3D%2222%22%20height%3D%228%22/%3E%3Crect%20x%3D%2242%22%20y%3D%2242%22%20width%3D%228%22%20height%3D%2222%22/%3E%3Crect%20x%3D%2242%22%20y%3D%2256%22%20width%3D%2222%22%20height%3D%228%22/%3E%3Crect%20x%3D%2256%22%20y%3D%2256%22%20width%3D%228%22%20height%3D%2222%22/%3E%3Crect%20x%3D%2242%22%20y%3D%2270%22%20width%3D%2222%22%20height%3D%228%22/%3E%3Crect%20x%3D%2267%22%20y%3D%2256%22%20width%3D%2212%22%20height%3D%228%22/%3E%3Crect%20x%3D%2290%22%20y%3D%2242%22%20width%3D%228%22%20height%3D%2236%22/%3E%3Crect%20x%3D%2282%22%20y%3D%2242%22%20width%3D%2210%22%20height%3D%228%22/%3E%3C/g%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{color-scheme:light;
 --bg:#FFFFFF;--app:#F3F4F6;--panel:#FFFFFF;--band:#F6F7F9;--hover:#F0F2F5;--line:#E5E8EE;--line2:#D3D8E0;
 --ink:#0B1220;--ink2:#3A4556;--mute:#6B7280;--faint:#9AA3AF;
 --sn:#ED5A24;--sn-ink:#C2410C;--focus:#1D4ED8;
 --up:#047857;--down:#B91C1C;--warn:#B45309;--warn-bg:#FEF3C7;--ctx:#6B7280;
 --c1:#2563EB;--c2:#D97706;--c3:#0D9488;
 --ins:#DCFCE7;--ins-ink:#166534;--del:#FEE2E2;--del-ink:#991B1B;
 --tipbg:#0B1220;--tipink:#F3F4F6;
 --sans:Inter,system-ui,-apple-system,"Segoe UI",sans-serif;--mono:"JetBrains Mono",ui-monospace,Menlo,monospace}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){color-scheme:dark;
 --bg:#0B0E13;--app:#07090D;--panel:#11151B;--band:#161B23;--hover:#1A202A;--line:#232B36;--line2:#2F3946;
 --ink:#E6E9EF;--ink2:#B4BCC8;--mute:#8B95A3;--faint:#6B7480;
 --sn:#E85D2A;--sn-ink:#F59A70;--focus:#60A5FA;
 --up:#34D399;--down:#F87171;--warn:#FBBF24;--warn-bg:#3A2A0A;--ctx:#8B95A3;
 --c1:#3B82F6;--c2:#B87A14;--c3:#16A394;
 --ins:#0F2F1E;--ins-ink:#86EFAC;--del:#3A1515;--del-ink:#FCA5A5;--tipbg:#E6E9EF;--tipink:#0B0E13}}
:root[data-theme="dark"]{color-scheme:dark;
 --bg:#0B0E13;--app:#07090D;--panel:#11151B;--band:#161B23;--hover:#1A202A;--line:#232B36;--line2:#2F3946;
 --ink:#E6E9EF;--ink2:#B4BCC8;--mute:#8B95A3;--faint:#6B7480;
 --sn:#E85D2A;--sn-ink:#F59A70;--focus:#60A5FA;
 --up:#34D399;--down:#F87171;--warn:#FBBF24;--warn-bg:#3A2A0A;--ctx:#8B95A3;
 --c1:#3B82F6;--c2:#B87A14;--c3:#16A394;
 --ins:#0F2F1E;--ins-ink:#86EFAC;--del:#3A1515;--del-ink:#FCA5A5;--tipbg:#E6E9EF;--tipink:#0B0E13}
*{box-sizing:border-box}
html,body{margin:0;background:var(--app);color:var(--ink);font:13px/1.45 var(--sans);-webkit-font-smoothing:antialiased}
a{color:inherit}button,input,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--focus);outline-offset:1px}
.m{font-family:var(--mono);font-feature-settings:"tnum","zero"}
.mute{color:var(--mute)}

/* top bar */
.bar{position:sticky;top:0;z-index:30;height:44px;display:flex;align-items:center;gap:12px;padding:0 14px;background:var(--bg);border-bottom:1px solid var(--line)}
.logo{display:flex;align-items:center;gap:8px;text-decoration:none;font-weight:600;font-size:13px;white-space:nowrap}
.logo i{width:20px;height:20px;border-radius:3px;background:var(--sn);color:#fff;display:grid;place-items:center;font:600 12px/1 var(--mono);font-style:normal}
.cmd{position:relative;flex:1;max-width:560px}
.cmd input{width:100%;height:30px;border:1px solid var(--line2);border-radius:3px;background:var(--band);padding:0 10px 0 64px;font:500 12.5px var(--mono);letter-spacing:.02em}
.cmd input:focus{outline:none;border-color:var(--focus);background:var(--bg)}
.cmd .sec{position:absolute;left:8px;top:6px;font:600 11px/18px var(--mono);color:var(--sn-ink);pointer-events:none}
.cmd .hint{position:absolute;right:8px;top:7px;font:500 10.5px/16px var(--mono);color:var(--faint);border:1px solid var(--line2);border-radius:3px;padding:0 5px;pointer-events:none}
.sug{position:absolute;left:0;right:0;top:34px;background:var(--bg);border:1px solid var(--line2);border-radius:3px;display:none;max-height:340px;overflow:auto;box-shadow:0 10px 30px -10px rgba(0,0,0,.25)}
.sug.on{display:block}
.sug a{display:grid;grid-template-columns:52px 1fr auto;gap:10px;padding:6px 10px;text-decoration:none;font-size:12.5px}
.sug a b{font:600 12px var(--mono)}.sug a span:last-child{color:var(--faint);font-size:11.5px}
.sug a.sel,.sug a:hover{background:var(--hover)}
.bar .sp{flex:1}
.btn{height:28px;border:1px solid var(--line2);background:var(--bg);border-radius:3px;padding:0 10px;font-size:12px;font-weight:500;cursor:pointer;white-space:nowrap;text-decoration:none;display:inline-flex;align-items:center;gap:6px}
.btn:hover{background:var(--hover)}
.btn.pri{background:var(--sn);border-color:var(--sn);color:#fff}
.btn.pri:hover{filter:brightness(.95)}

/* security header */
.sh{background:var(--bg);border-bottom:1px solid var(--line);padding:12px 16px 0}
.sh .id{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
.sh h1{font:600 20px/1.2 var(--sans);margin:0;letter-spacing:-.01em}
.sh .tk{font:600 12px var(--mono);background:var(--ink);color:var(--bg);border-radius:3px;padding:2px 6px}
.sh .sub{color:var(--mute);font-size:12px}
.sh .sub a{text-decoration:none;border-bottom:1px solid var(--line2)}
.sh .sub a:hover{color:var(--ink)}
.facts{display:flex;overflow-x:auto;margin:10px -16px 0;padding:0 16px;border-top:1px solid var(--line);scrollbar-width:thin}
.fact{padding:8px 14px 9px 0;margin-right:14px;border-right:1px solid var(--line);white-space:nowrap;min-width:max-content}
.fact:last-child{border-right:0}
.fact b{display:block;font:600 15px/1.25 var(--mono);letter-spacing:-.01em}
.fact b small{font-size:11px;font-weight:500;margin-left:5px}
.fact span{font-size:11px;color:var(--mute);display:flex;gap:6px;align-items:center}
.up{color:var(--up)}.down{color:var(--down)}

/* frame */
.frame{display:grid;grid-template-columns:196px minmax(0,1fr);min-height:calc(100vh - 44px)}
.rail{background:var(--bg);border-right:1px solid var(--line);padding:10px 0 40px;position:sticky;top:44px;align-self:start;height:calc(100vh - 44px);overflow:auto}
.rail .g{font:600 10.5px/1 var(--sans);letter-spacing:.08em;text-transform:uppercase;color:var(--faint);padding:14px 14px 6px}
.rail a{display:grid;grid-template-columns:36px 1fr auto;align-items:center;gap:6px;padding:5px 14px;text-decoration:none;color:var(--ink2);font-size:12.5px;border-left:2px solid transparent}
.rail a .c{font:600 10.5px var(--mono);color:var(--mute)}
.rail a .n{font:500 11px var(--mono);color:var(--faint)}
.rail a:hover{background:var(--hover);color:var(--ink)}
.rail a.on{background:var(--band);color:var(--ink);border-left-color:var(--sn);font-weight:600}
.rail a.on .c{color:var(--sn-ink)}
.view{display:none;padding:14px 16px 60px;min-width:0}
.view.on{display:block}
.vh{display:flex;align-items:baseline;gap:10px;margin:2px 0 12px;flex-wrap:wrap}
.vh h2{font:600 16px/1.3 var(--sans);margin:0}
.vh .code{font:600 11px var(--mono);color:var(--mute)}
.vh .lead{color:var(--ink2);flex-basis:100%;max-width:90ch;margin:2px 0 0}

/* panels */
.grid{display:grid;grid-template-columns:repeat(12,minmax(0,1fr));gap:12px}
.s12{grid-column:span 12}.s8{grid-column:span 8}.s7{grid-column:span 7}.s6{grid-column:span 6}.s5{grid-column:span 5}.s4{grid-column:span 4}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:3px;min-width:0;display:flex;flex-direction:column}
.ph{display:flex;align-items:center;gap:10px;height:32px;padding:0 10px;background:var(--band);border-bottom:1px solid var(--line)}
.ph h3{font:600 11px/1 var(--sans);letter-spacing:.06em;text-transform:uppercase;margin:0;color:var(--ink2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ph .sp{flex:1}
.ph .go{font:600 10.5px var(--mono);color:var(--mute);text-decoration:none;white-space:nowrap}
.ph .go:hover{color:var(--sn-ink)}
.ph .act{font:600 10.5px/1 var(--sans);letter-spacing:.06em;text-transform:uppercase;color:var(--mute);background:none;border:0;cursor:pointer;padding:4px 0;white-space:nowrap}
.ph .act:hover{color:var(--ink)}
.pb{padding:10px 12px 12px;flex:1;min-width:0}
.pb.flush{padding:0}

/* tables */
.tw{overflow-x:auto;max-width:100%}
table.t{border-collapse:collapse;width:100%;font-size:12.5px}
table.t th,table.t td{height:28px;padding:4px 10px;border-bottom:1px solid var(--line);text-align:right;white-space:nowrap;vertical-align:middle}
table.t th{font:600 10.5px/1.2 var(--sans);letter-spacing:.05em;text-transform:uppercase;color:var(--mute);background:var(--band);position:sticky;top:0}
table.t th.l,table.t td.l{text-align:left}
table.t td.wrap{white-space:normal;min-width:240px}
table.t td{font-family:var(--mono);font-feature-settings:"tnum"}
table.t td.l{font-family:var(--sans)}
table.t tr.grp td{background:var(--band);font:600 10.5px var(--sans);letter-spacing:.06em;text-transform:uppercase;color:var(--ink2);height:26px}
table.t tr.sub td{color:var(--mute);font-size:11.5px;height:24px}
table.t tr.sub td.l{padding-left:24px;font-style:normal}
table.t tr.hi td{font-weight:600}
table.t tbody tr:hover td{background:var(--hover)}
table.t tr.grp:hover td{background:var(--band)}
table.t th.div,table.t td.div{border-left:1px solid var(--line2)}
table.t tr.click{cursor:pointer}
table.t tr.more td{white-space:normal;background:var(--band);font-family:var(--sans);text-align:left;color:var(--ink2);padding:10px 12px 12px 46px;height:auto;line-height:1.55}
.na{color:var(--faint)}
.neg{color:var(--ink)}

/* page tags */
.pg{font:500 10.5px/1 var(--mono);color:var(--mute);border:1px solid var(--line2);border-radius:2px;padding:2px 4px;text-decoration:none;white-space:nowrap;display:inline-block}
.pg:hover{color:var(--focus);border-color:var(--focus)}
.pgs{display:inline-flex;gap:4px;flex-wrap:wrap}

/* signals */
.sig{display:inline-flex;align-items:center;gap:6px;font-weight:600;font-size:12px;white-space:nowrap;font-family:var(--sans)}
.sig i{font-style:normal;font:700 10px/1 var(--mono);width:16px;height:16px;border-radius:2px;display:grid;place-items:center}
.sig.up{color:var(--up)}.sig.up i{background:var(--up);color:var(--bg)}
.sig.ok{color:var(--up)}.sig.ok i{background:var(--up);color:var(--bg)}.sig.no{color:var(--down)}.sig.no i{background:var(--down);color:var(--bg)}
.sig.down{color:var(--down)}.sig.down i{background:var(--down);color:var(--bg)}
.sig.warn{color:var(--warn)}.sig.warn i{background:var(--warn);color:var(--bg)}
.sig.ctx{color:var(--ctx)}.sig.ctx i{border:1px solid var(--ctx);color:var(--ctx)}
.sig.neu{color:var(--ink2)}.sig.neu i{border:1px solid var(--line2);color:var(--mute)}

/* kpis */
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));border:1px solid var(--line);border-radius:3px;background:var(--panel);margin-bottom:12px}
.kpi{padding:10px 12px;border-right:1px solid var(--line)}
.kpi:last-child{border-right:0}
.kpi .k{font-size:11px;color:var(--mute);display:flex;justify-content:space-between;gap:6px;align-items:center}
.kpi .v{font:600 18px/1.3 var(--mono);letter-spacing:-.01em;margin-top:3px}
.kpi .s{font-size:11px;color:var(--mute);margin-top:1px}
.read{border-left:2px solid var(--sn);padding:2px 0 2px 12px;margin:0 0 12px;font-size:14px;line-height:1.55;max-width:96ch;color:var(--ink)}
.note{color:var(--mute);font-size:12px;margin:8px 0 0;max-width:96ch}
.empty{border:1px dashed var(--line2);border-radius:3px;padding:12px;color:var(--mute);font-size:12.5px;background:var(--band)}
.empty b{color:var(--ink2)}

/* charts */
.chart{position:relative}
.chart svg{display:block;width:100%;height:auto;overflow:visible}
.chart .ax{font:10.5px var(--mono);fill:var(--mute)}
.chart .lbl{font:600 10.5px var(--mono);fill:var(--ink2)}
.chart .gl{stroke:var(--line);stroke-width:1}
.chart .zl{stroke:var(--faint);stroke-width:1}
.leg{display:flex;gap:12px;flex-wrap:wrap;font-size:11.5px;color:var(--ink2);margin:0 0 6px}
.leg span{display:inline-flex;align-items:center;gap:5px}.leg i{width:9px;height:9px;border-radius:2px;display:inline-block}
.tip{position:fixed;pointer-events:none;background:var(--tipbg);color:var(--tipink);border-radius:3px;padding:7px 9px;font-size:11.5px;line-height:1.5;opacity:0;transition:opacity .06s;z-index:60;min-width:150px;max-width:280px;box-shadow:0 8px 24px rgba(0,0,0,.3)}
.tip .r{display:flex;justify-content:space-between;gap:14px}.tip .r span{opacity:.7}.tip .r b{font:600 11.5px var(--mono)}
.tip .h{font-weight:600;margin-bottom:3px}

/* tabs (FactSet underline) */
.tabs{display:flex;gap:18px;border-bottom:1px solid var(--line);margin:0 0 10px;overflow-x:auto}
.tabs button{background:none;border:0;border-bottom:2px solid transparent;padding:6px 0 7px;font:600 11px/1 var(--sans);letter-spacing:.06em;text-transform:uppercase;color:var(--mute);cursor:pointer;white-space:nowrap}
.tabs button.on{color:var(--ink);border-bottom-color:var(--sn)}
.tabs button:hover{color:var(--ink)}
.tabs button b{font-family:var(--mono);font-weight:500;margin-left:5px;color:var(--faint)}


.thread{display:flex;flex-direction:column;gap:18px;margin-bottom:14px}
.turn{display:flex;flex-direction:column;gap:10px}
.qb{align-self:flex-end;max-width:80%;background:var(--band);border:1px solid var(--line);border-radius:10px 10px 2px 10px;padding:9px 13px;font-size:14px;white-space:pre-wrap}
.ab{max-width:92ch;font-size:14px;line-height:1.65}
.ab.err{color:var(--ink2)}
.ab.wait{color:var(--mute);display:flex;align-items:center;gap:10px;font-size:13px}
.dots{display:inline-flex;gap:4px}.dots i{width:6px;height:6px;border-radius:50%;background:var(--faint);animation:blink 1.2s infinite both}
.dots i:nth-child(2){animation-delay:.2s}.dots i:nth-child(3){animation-delay:.4s}
@keyframes blink{0%,80%,100%{opacity:.25}40%{opacity:1}}
.md p{margin:0 0 10px}.md h4{font:600 13px/1.4 var(--sans);letter-spacing:.02em;margin:16px 0 6px;color:var(--ink)}
.md ul,.md ol{margin:0 0 10px;padding-left:20px}.md li{margin:0 0 6px}.md b{font-weight:600}
.md .pg{margin:0 1px;vertical-align:1px}.pg.dv{cursor:help}
.ab .meta{font-size:11.5px;color:var(--faint);margin-top:4px;display:flex;flex-wrap:wrap;gap:4px;align-items:center}
.composer{display:flex;gap:8px;align-items:flex-end;border-top:1px solid var(--line);padding-top:12px}
textarea.askin{flex:1;min-height:40px;max-height:160px;resize:none;border:1px solid var(--line2);border-radius:3px;background:var(--bg);padding:10px 12px;font:14px/1.5 var(--sans)}
textarea.askin:focus{outline:none;border-color:var(--focus)}
.composer .btn{height:40px;padding:0 18px}
.starters{display:flex;flex-wrap:wrap;gap:8px;align-items:center}.starters>div{flex-basis:100%}
button.chip{border:1px solid var(--line2);background:var(--bg);border-radius:3px;padding:6px 10px;font-size:12.5px;cursor:pointer;text-align:left}
button.chip:hover{border-color:var(--ink2);background:var(--hover)}
details.apps{background:var(--panel);border:1px solid var(--line);border-radius:3px}
details.apps>summary{cursor:pointer;padding:9px 12px;font-size:12px;color:var(--ink2)}

.newbar{display:flex;gap:12px;align-items:center;justify-content:space-between;flex-wrap:wrap;background:var(--warn-bg);border:1px solid var(--line2);border-radius:3px;padding:8px 12px;margin:0 0 10px;font-size:12.5px}
.rd{font-size:12.5px;line-height:1.55;color:var(--ink2);margin-top:4px;white-space:normal}
.tabrow{display:flex;justify-content:space-between;align-items:flex-end;gap:12px;flex-wrap:wrap;border-bottom:1px solid var(--line);margin:0 0 10px}.tabrow .tabs{border-bottom:0;margin:0}
.seg{display:inline-flex;border:1px solid var(--line2);border-radius:3px;overflow:hidden;margin-bottom:6px}.seg button{background:var(--bg);border:0;border-right:1px solid var(--line2);padding:5px 10px;font:500 11.5px var(--sans);cursor:pointer;color:var(--ink2)}.seg button:last-child{border-right:0}.seg button.on{background:var(--ink);color:var(--bg)}
h3.subh{font:600 11px/1 var(--sans);letter-spacing:.06em;text-transform:uppercase;color:var(--mute);margin:22px 0 10px}
details.long summary{cursor:pointer;list-style:none}details.long summary::-webkit-details-marker{display:none}details.long[open] summary{display:none}
.askhint{font-size:12.5px;color:var(--ink2);margin-top:8px;display:flex;flex-wrap:wrap;gap:8px;align-items:center}.askhint:empty{display:none}
.msg{font-size:12.5px;margin-top:8px;color:var(--ink2)}.msg:empty{display:none}.msg.ok{color:var(--up)}.msg.err{color:var(--down)}
p.lead{font-size:13px;line-height:1.55;color:var(--ink2);margin:0 0 10px}.small{font-size:11.5px}
td.acts{white-space:nowrap;text-align:right}td.acts .btn{margin-left:6px}
.cmdl{font:11px/1.4 var(--mono);color:var(--mute);margin-top:4px;word-break:break-all;white-space:normal;max-width:360px}
.frow{display:grid;grid-template-columns:90px minmax(0,1fr);gap:8px;align-items:center;margin:0 0 8px;font-size:12.5px}.frow>label{color:var(--mute)}
input.in{height:30px;border:1px solid var(--line2);border-radius:3px;background:var(--bg);padding:0 8px;font:13px var(--sans);color:var(--ink);min-width:0}input.in.mono{font-family:var(--mono);font-size:12px}input.in:focus{outline:none;border-color:var(--focus)}
select.sel.wide{height:30px;width:100%}
details.adv{margin:0 0 8px;font-size:12px}details.adv summary{cursor:pointer;color:var(--mute);margin-bottom:8px}
.btns{display:flex;gap:8px;flex-wrap:wrap;margin-top:6px}
@media (max-width:820px){table.apps1 tr{display:grid;grid-template-columns:minmax(0,1fr) auto;border-bottom:1px solid var(--line)}table.apps1 td{border:0;height:auto}table.apps1 td.acts{grid-column:1/-1;text-align:left;padding-bottom:10px}table.apps1 td.acts .btn{margin:0 6px 0 0}.frow{grid-template-columns:72px minmax(0,1fr)}}
.strip{display:flex;flex-wrap:wrap;gap:8px;align-items:center;font-size:12px;margin:0 0 10px}
.appchip{border:1px solid var(--line2);border-radius:3px;padding:2px 7px;font-weight:500;color:var(--ink2)}.appchip.on{border-color:var(--up);color:var(--up)}.appchip.off{color:var(--down)}
ol.setup{margin:0;padding-left:20px;font-size:13.5px;line-height:1.6}ol.setup li{margin:0 0 12px}
.apps-row{display:flex;flex-wrap:wrap;gap:8px;margin-top:8px}.apps-row a.chip{text-decoration:none;display:flex;flex-direction:column;gap:2px}.apps-row small{color:var(--mute);font-size:11px}
input.mv{width:110px;height:28px;border:1px solid var(--line2);border-radius:3px;background:var(--bg);padding:0 8px;font:500 12.5px var(--mono)}
.wedge{border:1px solid var(--line);background:var(--panel);border-radius:3px;padding:12px 14px;display:flex;flex-direction:column;gap:8px;font-size:14px}
.wbar>div{display:grid;grid-template-columns:56px 1fr 60px;align-items:center;gap:8px;margin:3px 0;font-size:12px}.wbar i{display:block;height:10px;border-radius:2px;background:var(--c3);min-width:2px}.wbar i.v{background:var(--c1)}.wbar b{font:600 12px var(--mono)}
table.t tr.chg td{height:20px;font-size:11px;padding-top:0;padding-bottom:3px;border-bottom:1px solid var(--line)}table.t tr.chg td.l{color:var(--faint);font-family:var(--sans)}
table.t tbody tr:has(+ tr.chg) td{border-bottom:0}
input.mv.src{width:240px;font-family:var(--sans)}
table.t td.lab{white-space:normal;min-width:240px;max-width:520px;line-height:1.4;padding-top:5px;padding-bottom:5px}
/* diff */
.ex{font-size:13px;line-height:1.6;color:var(--ink2);margin:0 0 8px}
.ex ins{background:var(--ins);color:var(--ins-ink);text-decoration:none;border-radius:2px;padding:0 2px}
.ex del{background:var(--del);color:var(--del-ink);border-radius:2px;padding:0 2px}
.ex .pg{margin-left:6px}
.stack{display:flex;height:8px;gap:2px;min-width:120px}
.stack i{display:block;border-radius:1px}
blockquote.q{margin:0;font-size:13px;line-height:1.6;color:var(--ink2);border-left:2px solid var(--line2);padding-left:10px}
.tagx{font:600 10px/1 var(--sans);letter-spacing:.06em;text-transform:uppercase;color:var(--mute);border:1px solid var(--line2);border-radius:2px;padding:3px 5px;white-space:nowrap}
.tagx.rel{color:var(--ink);border-color:var(--ink2)}

/* yours */
textarea.mine{width:100%;min-height:150px;border:1px solid var(--line2);border-radius:3px;background:var(--bg);padding:12px 14px;font:14px/1.65 var(--sans);resize:vertical}
textarea.mine:focus{outline:none;border-color:var(--focus)}
.saved{font-size:11.5px;color:var(--mute);margin-top:6px}
.askrow{display:flex;gap:8px}
.askrow input{flex:1;height:36px;border:1px solid var(--line2);border-radius:3px;background:var(--bg);padding:0 12px;font-size:14px}
.askrow input:focus{outline:none;border-color:var(--focus)}
.askrow .btn{height:36px;padding:0 18px}
.askopts{display:flex;gap:14px;flex-wrap:wrap;margin:10px 0 0;font-size:12px;color:var(--mute)}
.askopts label{display:flex;align-items:center;gap:6px}
select.sel{height:28px;border:1px solid var(--line2);border-radius:3px;background:var(--bg);padding:0 6px;font:500 12px var(--sans);color:var(--ink)}
.reply{margin-top:14px;font-size:14px;line-height:1.65;white-space:pre-wrap;max-width:96ch}
code.cl{display:block;font:12px/1.5 var(--mono);background:var(--band);border:1px solid var(--line);border-radius:3px;padding:8px 10px;margin:6px 0;overflow-x:auto;white-space:pre}
.foot{color:var(--faint);font-size:11.5px;padding:18px 0 0;border-top:1px solid var(--line);margin-top:18px;max-width:110ch}
.kbd{font:500 10.5px var(--mono);border:1px solid var(--line2);border-radius:2px;padding:0 4px;color:var(--mute)}

@media (max-width:1100px){.s8,.s7,.s6,.s5,.s4{grid-column:span 12}}
@media (max-width:820px){
 .frame{grid-template-columns:minmax(0,1fr)}
 .rail{position:sticky;top:44px;z-index:20;height:auto;display:flex;overflow-x:auto;padding:0;border-right:0;border-bottom:1px solid var(--line)}
 .rail .g{display:none}
 .rail a{grid-template-columns:auto;padding:9px 12px;border-left:0;border-bottom:2px solid transparent;white-space:nowrap}
 .rail a .c,.rail a .n{display:none}
 .rail a.on{border-bottom-color:var(--sn);background:none}
 .cmd .hint,.logo span{display:none}
 .cmd input{padding-left:52px}
 .view{padding:12px 12px 50px}
 .kpi{border-right:0;border-bottom:1px solid var(--line)}
 .askrow{flex-direction:column}
}
@media (max-width:480px){.bar .btn.sec2{display:none}.kpis{grid-template-columns:1fr 1fr}}

<script>
const DATA = __DATA__;
</script>
<script>
"use strict";
const $=(s,r=document)=>r.querySelector(s);
const el=(t,a={},...k)=>{const e=document.createElement(t);for(const[x,y]of Object.entries(a||{})){if(y==null||y===false)continue;if(x==='html')e.innerHTML=y;else if(x==='text')e.textContent=y;else if(x.startsWith('on'))e.addEventListener(x.slice(2),y);else e.setAttribute(x,y)}k.flat(9).forEach(c=>{if(c==null||c===false)return;e.append(c.nodeType?c:document.createTextNode(c))});return e};
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const M=DATA.meta,Q=DATA.q||{},FL=DATA.flags||[],KEY='ipo-dash:'+M.cik+':';
const TK=(M.ticker||'IPO');
const store={get(k){try{return localStorage.getItem(KEY+k)}catch(e){return null}},set(k,v){try{localStorage.setItem(KEY+k,v)}catch(e){}}};
const converts=FL.some(f=>/turns into shares/i.test(f.title));

/* ---------- numbers ---------- */
const NA='NA';
const money=(v,d)=>{if(v==null||isNaN(v))return NA;if(v===0)return'$0';const a=Math.abs(v),s=v<0?'−':'';if(a>=1e6)return s+'$'+(a/1e6).toFixed(2)+'T';if(a>=1000)return s+'$'+(a/1000).toFixed(a>=100000?0:1)+'B';if(a>=10)return s+'$'+a.toFixed(d??0)+'M';if(a>=1)return s+'$'+a.toFixed(d??1)+'M';return s+'$'+Math.round(a*1000)+'K'};
const acct=v=>{if(v==null||isNaN(v))return NA;const a=Math.abs(v);const t=a>=100?Math.round(a).toLocaleString('en-US'):a.toLocaleString('en-US',{maximumFractionDigits:a<1?3:1});return v<0?'('+t+')':t};
const pct=v=>v==null||isNaN(v)?NA:(v>0?'+':v<0?'−':'')+Math.abs(v).toLocaleString('en-US',{maximumFractionDigits:Math.abs(v)>=100?0:1})+'%';
const order=k=>{const y=+(String(k).match(/(\d{4})/)||[0,0])[1];return y*10+(/^\d{4}$/.test(k)?0:/^3M/.test(k)?1:/^6M/.test(k)?2:/^9M/.test(k)?3:4)};
const keys=o=>Object.keys(o||{}).sort((a,b)=>order(a)-order(b));
const isFY=k=>/^\d{4}$/.test(k);
const label=k=>isFY(k)?'FY'+k.slice(2):String(k).replace(/^(\dM) (\d{4})$/,(m,a,b)=>a+' ’'+b.slice(2)).replace(/^([A-Z][a-z]{2}) (\d{4})$/,(m,a,b)=>a+' ’'+b.slice(2));
const V=x=>x&&x.values&&Object.keys(x.values).length?x.values:null;
const lastK=o=>{const k=keys(o);return k[k.length-1]};
const lastFY=o=>{const k=keys(o).filter(isFY);return k[k.length-1]};
const fmtDate=d=>{if(!d)return'';const[y,m,dd]=d.split('-');return `${+dd} ${['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'][+m-1]} ${y}`};
const pages=s=>String(s||'').split(/,\s*|\s+vs\s+/).filter(Boolean).filter((v,i,a)=>a.indexOf(v)===i);
const pgLink=p=>el('a',{class:'pg',href:M.latest?M.latest.url:'#',target:'_blank',rel:'noopener',title:(p==='unnumbered'?'A front page without a printed number':'Printed page '+p)+' of the '+(M.latest?M.latest.form+' filed '+fmtDate(M.latest.date):'filing')+' on SEC.gov'},p==='cover'?'cover':p==='unnumbered'?'front':'p.'+p);
const pgs=s=>el('span',{class:'pgs'},pages(s).map(pgLink));
const sig=(tone,txt)=>el('span',{class:'sig '+tone},el('i',{},{up:'▲',down:'▼',warn:'!',ctx:'i',neu:'–',ok:'✓',no:'×'}[tone]||'·'),txt);

/* ---------- tooltip ---------- */
const tip=$('#tip');
function showTip(e,h,rows){tip.innerHTML=(h?`<div class="h">${esc(h)}</div>`:'')+rows.map(([k,v])=>`<div class="r"><span>${esc(k)}</span><b>${esc(v)}</b></div>`).join('');tip.style.opacity=1;const w=tip.offsetWidth,hh=tip.offsetHeight;let x=e.clientX+14,y=e.clientY-hh-12;if(x+w>innerWidth-8)x=e.clientX-w-14;if(y<52)y=e.clientY+16;tip.style.left=x+'px';tip.style.top=y+'px'}
const hideTip=()=>{tip.style.opacity=0};

/* ---------- views + charts registry ---------- */
const VIEWS=[];let BUILDING=null;const charts=[];let CUR='DES';
function chartReg(fn){charts.push({v:BUILDING,fn})}
function renderCharts(){charts.filter(c=>c.v===CUR).forEach(c=>c.fn())}

function nice(lo,hi){const span=hi-lo||1,s0=span/4,mag=Math.pow(10,Math.floor(Math.log10(s0))),f=s0/mag,st=(f<1.5?1:f<3?2:f<7?5:10)*mag;return{lo:Math.floor(lo/st)*st,hi:Math.ceil(hi/st)*st,step:st}}
function bars(series,cats,opts={}){
 const box=el('div',{class:'chart'});
 if(series.length>1)box.append(el('div',{class:'leg'},series.map(s=>el('span',{},el('i',{style:`background:var(${s.color})`}),s.name))));
 const host=el('div');box.append(host);
 chartReg(()=>{host.innerHTML='';const W=Math.max(300,host.clientWidth||600),H=opts.h||220,pl=56,pr=8,pt=18,pb=26;
  const vals=series.flatMap(s=>cats.map(c=>s.values[c]).filter(v=>v!=null));if(!vals.length){host.append(el('div',{class:'empty'},'Nothing to draw: the filing gave no values here.'));return}
  const{lo,hi,step}=nice(Math.min(0,...vals),Math.max(0,...vals));const y=v=>pt+(hi-v)/(hi-lo)*(H-pt-pb);
  const gw=(W-pl-pr)/cats.length,inner=Math.min(gw*.7,series.length*44),bw=Math.max(5,(inner-(series.length-1)*2)/series.length);
  let s=`<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="${esc(opts.aria||'')}">`;
  for(let v=lo;v<=hi+1e-9;v+=step){s+=`<line class="${Math.abs(v)<1e-9?'zl':'gl'}" x1="${pl}" x2="${W-pr}" y1="${y(v)}" y2="${y(v)}"/><text class="ax" x="${pl-8}" y="${y(v)+3.5}" text-anchor="end">${money(v)}</text>`}
  cats.forEach((c,i)=>{const gx=pl+i*gw+(gw-inner)/2;
   if(i>0&&isFY(cats[i-1])&&!isFY(c)){const sx=pl+i*gw;s+=`<line x1="${sx}" x2="${sx}" y1="${pt-6}" y2="${H-pb}" stroke="var(--line2)" stroke-dasharray="3 3"/><text class="ax" x="${sx+5}" y="${pt-8}">${/^\dM/.test(c)?'YEAR TO DATE':'PERIOD END'}</text>`}
   s+=`<text class="ax" x="${pl+i*gw+gw/2}" y="${H-8}" text-anchor="middle">${esc(label(c))}</text>`;
   series.forEach((se,j)=>{const v=se.values[c];if(v==null)return;const x=gx+j*(bw+2),y0=y(0),y1=y(v),h=Math.max(1,Math.abs(y1-y0)),top=Math.min(y0,y1),r=Math.min(3,bw/2,h);
    const d=v>=0?`M${x},${y0}V${top+r}Q${x},${top} ${x+r},${top}H${x+bw-r}Q${x+bw},${top} ${x+bw},${top+r}V${y0}Z`:`M${x},${y0}V${top+h-r}Q${x},${top+h} ${x+r},${top+h}H${x+bw-r}Q${x+bw},${top+h} ${x+bw},${top+h-r}V${y0}Z`;
    s+=`<path d="${d}" fill="var(${se.color})"/>`;
    if(opts.labels!==false&&(series.length===1||opts.labels===true))s+=`<text class="lbl" x="${x+bw/2}" y="${v>=0?top-4:top+h+11}" text-anchor="middle">${money(v)}</text>`;
    s+=`<rect x="${x-3}" y="${Math.min(top,y0)-6}" width="${bw+6}" height="${h+12}" fill="transparent" data-j="${j}" data-c="${esc(c)}"/>`})});
  s+='</svg>';host.innerHTML=s;
  host.querySelectorAll('rect[data-j]').forEach(r=>{const se=series[+r.dataset.j],c=r.dataset.c;r.addEventListener('mousemove',e=>showTip(e,se.name,[['Period',label(c)],['Value',money(se.values[c])],...(se.page?[['Source','p.'+se.page]]:[])]));r.addEventListener('mouseleave',hideTip)})});
 return box}
function hbars(items,opts={}){const box=el('div',{class:'chart'});
 chartReg(()=>{box.innerHTML='';const W=Math.max(300,box.clientWidth||560),rh=26,H=items.length*rh+4,lw=Math.min(280,W*.45),fmt=opts.fmt||money;
  const max=Math.max(...items.map(i=>Math.abs(i.v)))||1;let s=`<svg viewBox="0 0 ${W} ${H}">`;
  items.forEach((it,i)=>{const y=2+i*rh,w=Math.max(2,(W-lw-78)*Math.abs(it.v)/max);
   s+=`<text x="0" y="${y+16}" style="font:12px var(--sans);fill:var(--ink2)">${esc(it.k.length>44?it.k.slice(0,42)+'…':it.k)}</text>`;
   s+=`<path d="M${lw},${y+5}H${lw+w-3}Q${lw+w},${y+5} ${lw+w},${y+8}V${y+18}Q${lw+w},${y+21} ${lw+w-3},${y+21}H${lw}Z" fill="var(${it.hl?'--c2':'--c1'})"/>`;
   s+=`<text class="lbl" x="${lw+w+6}" y="${y+16.5}">${fmt(it.v)}</text>`;
   s+=`<rect x="0" y="${y}" width="${W}" height="${rh}" fill="transparent" data-i="${i}"/>`});
  s+='</svg>';box.innerHTML=s;box.querySelectorAll('[data-i]').forEach(r=>{const it=items[+r.dataset.i];r.addEventListener('mousemove',e=>showTip(e,it.k,[['Value',fmt(it.v)],...(it.rows||[])]));r.addEventListener('mouseleave',hideTip)})});
 return box}
let rt;addEventListener('resize',()=>{clearTimeout(rt);rt=setTimeout(renderCharts,120)});

/* ---------- building blocks ---------- */
function panel(title,cls,body,o={}){const h=el('div',{class:'ph'},el('h3',{},title),el('span',{class:'sp'}),o.act||null,o.go?el('a',{class:'go',href:'#'+o.go,title:'Open the full view'},TK+' '+o.go+' ›'):null,o.page?pgs(o.page):null);
 return el('section',{class:'panel '+(cls||'')},h,el('div',{class:'pb'+(o.flush?' flush':'')},body))}
function kpi(k,v,s,page,cls){return el('div',{class:'kpi'},el('div',{class:'k'},el('span',{},k),page?pgs(page):null),el('div',{class:'v '+(cls||'')},v),s?el('div',{class:'s'},s):null)}
function table(head,rows,o={}){const t=el('table',{class:'t'});const th=el('thead');(Array.isArray(head[0])?head:[head]).forEach(hr=>th.append(el('tr',{},hr.map(h=>typeof h==='string'?el('th',{class:''},h):el('th',h.a||{},h.t)))));t.append(th);const tb=el('tbody');rows.forEach(r=>tb.append(r));t.append(tb);return el('div',{class:'tw'},t)}
function missing(what,f){const st=f&&f.status||'not read';return el('div',{class:'empty'},el('b',{},what+': '+st+'. '),st==='not disclosed'?'The filing is silent here. A silence is a finding.':st==='not found'?'No such table in this filing.':'The code could not read this table, so it says so instead of showing zero.')}
function viewHead(code,name,lead){return el('div',{class:'vh'},el('h2',{},name),el('span',{class:'code'},TK+' '+code),lead?el('p',{class:'lead'},lead):null)}
function addView(code,name,grp,num,build){VIEWS.push({code,name,grp,num,build})}

/* ---------- the five answers, computed once ---------- */
const G=Q.q1_growth||{},C2=Q.q2_funds_itself||{},D3=Q.q3_debt||{},P4=Q.q4_profit_real||{},P5=Q.q5_price||{};
const REV=V(G.revenue),REVI=V(G.revenue_interim);
function interimGrowth(){if(!REVI)return null;const k=keys(REVI);if(k.length<2)return null;const a=k[k.length-2],b=k[k.length-1];if(a.split(' ')[0]!==b.split(' ')[0]||!REVI[a])return null;return{from:a,to:b,pct:(REVI[b]/REVI[a]-1)*100}}
const IG=interimGrowth();
const A={};
(function(){
 // 1 growth
 if(REV){const lk=lastFY(REV),gp=(G.growth_pct||{})[lk];let t=`Revenue ${gp>=0?'grew':'fell'} ${gp!=null?Math.abs(gp).toFixed(0)+'%':''} in ${label(lk)}.`;
  if(IG)t+=` Year to date it is ${IG.pct>=0?'up':'down'} ${Math.abs(IG.pct).toFixed(0)}% (${label(IG.to)} on ${label(IG.from)}).`;
  if(keys(REV).filter(isFY).length<3)t+=` Only ${keys(REV).filter(isFY).length} audited years exist; stay humble about calling a trend.`;
  const fig=IG?REVI[IG.to]:REV[lk];A.q1={tone:gp==null?'neu':gp>=0?'up':'down',status:gp==null?'Read':gp>=0?'Growing':'Shrinking',text:t,fig:money(fig),figk:'Revenue, '+label(IG?IG.to:lk),page:G.revenue.page}}
 else A.q1={tone:'neu',status:'Not read',text:'Revenue could not be read.',fig:NA,figk:'Revenue'};
 // 2 funds itself
 const o=V(C2.operating_cash_flow),fc=V(C2.free_cash_flow);
 if(fc){const k=keys(fc),neg=k.filter(x=>fc[x]<0).length,lk=lastK(fc);
  A.q2={tone:neg===0?'up':neg===k.length?'warn':'warn',status:neg===0?'Self-funded':neg===k.length?'Outside money':'Mixed',fig:money(fc[lk]),figk:'Free cash flow, '+label(lk),page:C2.free_cash_flow.page,
   text:neg===0?'Free cash flow was positive in every period shown. The business paid for its own growth.':neg===k.length?'Free cash flow was negative in every period shown. Growth was paid for with outside money.':`Free cash flow was negative in ${neg} of ${k.length} periods shown. The latest, ${label(lk)}, was ${money(fc[lk])}. Check what the spending bought.`}}
 else if(o){const lk=lastK(o);A.q2={tone:'neu',status:'Partly read',fig:money(o[lk]),figk:'Operating cash flow, '+label(lk),page:C2.operating_cash_flow.page,text:'Capex could not be read, so free cash flow is not shown.'}}
 else A.q2={tone:'neu',status:'Not read',fig:NA,figk:'Free cash flow',text:'Operating cash flow could not be read.'};
 // 3 debt
 const nd=V(D3.net_debt),eq=V(D3.equity),w=D3.debt_to_equity&&D3.debt_to_equity.warning;
 if(D3.equity_negative){const k=lastK(eq);A.q3={tone:converts?'ctx':'warn',status:'Equity below zero',fig:money(eq[k]),figk:'Equity, '+label(k),page:D3.equity.page,text:'Equity is below zero, so the usual debt ratios mean nothing here.'+(converts?' The flags show pre-IPO funding that turns into shares at the offering, which is usually why.':' Read the flags before anything else.')}}
 else if(nd){const k=lastK(nd);A.q3={tone:w?'warn':nd[k]<0?'up':'warn',status:w?'Ratio warning':nd[k]<0?'Net cash':'Net debt',fig:money(nd[k]),figk:'Net debt, '+label(k),page:(D3.debt||{}).page,text:w?w:nd[k]<0?'The company holds more cash than debt.':'Debt is above cash: read the maturity schedule.'}}
 else A.q3={tone:'neu',status:'Not read',fig:NA,figk:'Net debt',text:'Debt could not be read from the balance sheet.'};
 // 4 profit real
 const ni=V(C2.net_income),gap=V(P4.gap);
 if(ni&&o){const k=lastK(ni),gp=gap?gap[k]:null;
  if(ni[k]<0&&gp!=null&&gp>Math.abs(ni[k])*.5)A.q4={tone:'ctx',status:'Loss mostly not cash',text:`In ${label(k)} the company reported a ${money(ni[k])} result but its operations produced ${money(o[k])} of cash. Most of the loss is not cash: read the non-cash items before reading the loss.`};
